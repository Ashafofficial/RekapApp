<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup VVIP - Sarimbit Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-[90%] text-center border border-slate-200">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        
        <h2 class="text-2xl font-black text-slate-800 mb-1">SARIMBIT VVIP</h2>
        <p class="text-xs font-semibold text-slate-500 mb-6">Otorisasi perangkat ini untuk mengakses database.</p>
        
        <input type="password" id="pinInput" class="w-full text-center py-3 px-4 bg-slate-50 border border-slate-300 rounded-xl text-xl tracking-[0.5em] font-black text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all mb-4" placeholder="PIN MASTER">
        
        <button onclick="pasangSertifikat()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-black py-3 rounded-xl shadow-lg hover:shadow-indigo-500/30 active:scale-95 transition-all">
            AKTIFKAN PERANGKAT
        </button>
        
        <div id="status" class="mt-5 text-sm font-bold"></div>
    </div>

    <script>
       function pasangSertifikat() {
            const pin = document.getElementById('pinInput').value;
            const status = document.getElementById('status');
            
            const PIN_BENAR = "961030"; 
            
            if(pin === PIN_BENAR) {
                // Menanamkan Sertifikat VVIP ke memori HP
                localStorage.setItem('sarimbit_vip_token', 'SARIMBIT-VVIP-AUTH-999');
                
                status.className = "mt-5 text-sm font-bold text-emerald-600 bg-emerald-50 py-2 px-3 rounded-lg border border-emerald-200";
                status.innerHTML = "✅ BERHASIL! Mengalihkan ke aplikasi...";
                document.getElementById('pinInput').value = '';
                
                // MENGEMBALIKAN KE HALAMAN UTAMA SETELAH 1.5 DETIK
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } else {
                status.className = "mt-5 text-sm font-bold text-rose-600 bg-rose-50 py-2 px-3 rounded-lg border border-rose-200";
                status.innerHTML = "❌ PIN SALAH! Akses Ditolak.";
            }
        }
    </script>
</body>
</html>
