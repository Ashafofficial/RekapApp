<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riwayat Aktivitas - Sarimbit Pro</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Pastikan database.js dimuat lebih dulu agar kunci Supabase terbaca -->
    <script src="database.js?v=999"></script>

    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f2f4f7;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent; 
        }
        .glass-header { 
            background: rgba(242, 244, 247, 0.9) !important; 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important; 
        }
        .log-card {
            background: #ffffff; border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }
        .log-card:active { transform: scale(0.98); }
        .timeline-line {
            position: absolute; left: 23px; top: 40px; bottom: -20px;
            width: 2px; background-color: #e2e8f0; z-index: 0;
        }
        .log-item:last-child .timeline-line { display: none; }
        .animate-enter { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="relative min-h-screen pb-10">

    <nav class="glass-header sticky top-0 z-50 pt-4 pb-3 px-4 sm:px-6 lg:px-8 mb-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:text-slate-900 transition-colors">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="text-xl font-black tracking-tight text-slate-800">Riwayat Sistem</h1>
            </div>
            <button onclick="muatRiwayatPusat()" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-4 py-2 rounded-full border border-blue-100 hover:bg-blue-600 hover:text-white transition-all shadow-sm active:scale-95">
                <i class="fa-solid fa-rotate mr-1"></i> Refresh
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-6 animate-enter">
            <h2 class="text-2xl font-black tracking-tight text-slate-800">Aktivitas Pusat</h2>
            <p class="text-sm font-medium text-slate-500 mt-1">Rekam jejak perubahan data dari seluruh perangkat admin.</p>
        </div>
        <div id="log-container" class="space-y-4 relative pb-10 animate-enter"></div>
    </main>

    <script>
        window.onload = () => { muatRiwayatPusat(); };

        async function muatRiwayatPusat() {
            const container = document.getElementById('log-container');
            container.innerHTML = `
                <div class="text-center py-20">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i>
                    <p class="font-bold text-slate-400 text-sm">Menarik ratusan data dari Supabase...</p>
                </div>
            `;

            try {
                if (!navigator.onLine) throw new Error("Koneksi Internet Terputus.");

                // Tarik data menggunakan fetch murni agar jika ada error langsung terbaca
                const res = await fetch(`${SUPABASE_URL}/rest/v1/logs?select=*&order=id.desc&limit=250`, {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(`Akses ditolak Supabase (HTTP ${res.status}): ${errText}`);
                }

                const logsData = await res.json();

                // Detektor RLS: Jika Supabase merespon "sukses" tapi datanya KOSONG
                if (logsData.length === 0) {
                    container.innerHTML = `
                        <div class="bg-rose-50 border border-rose-200 p-6 rounded-2xl mb-4 text-center shadow-sm">
                            <i class="fa-solid fa-lock text-4xl text-rose-400 mb-4"></i>
                            <h3 class="text-rose-700 font-black mb-2 text-lg">Supabase Mengunci Data Anda</h3>
                            <p class="text-xs font-bold text-rose-600 mb-2">Tabel "logs" terkunci oleh RLS (Row Level Security).</p>
                            <p class="text-[10px] text-rose-500 leading-relaxed bg-white p-3 rounded-xl border border-rose-100">
                                <b>Solusi:</b> Buka Supabase > Tabel "logs" > Klik tulisan "RLS policy" di kanan atas > Lalu pilih "Disable RLS" agar aplikasi bisa membacanya.
                            </p>
                        </div>
                    `;
                    return;
                }

                // Backup otomatis ke lokal jika sukses
                if (typeof dbLokal !== 'undefined') {
                    try { await dbLokal.logs.bulkPut(logsData); } catch(e) {}
                }

                renderRiwayat(logsData, container);

            } catch (error) {
                // Tampilkan Kotak Merah Peringatan jika Fetch gagal total
                container.innerHTML = `
                    <div class="bg-rose-50 border border-rose-200 p-5 rounded-2xl mb-6 shadow-sm">
                        <h3 class="text-rose-700 font-black mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i> GAGAL MENARIK DARI SERVER</h3>
                        <p class="text-[11px] font-bold text-rose-600">${error.message}</p>
                        <p class="text-[9px] text-rose-500 mt-2 font-bold uppercase tracking-widest bg-rose-100 p-1.5 rounded inline-block">Menampilkan mode offline (Memori Lokal)</p>
                    </div>
                    <div id="fallback-container"></div>
                `;

                // Render data dari memori lokal (sisa 5 data tadi)
                if (typeof dbLokal !== 'undefined') {
                    const localLogs = await dbLokal.logs.orderBy('time').reverse().limit(150).toArray();
                    renderRiwayat(localLogs, document.getElementById('fallback-container'));
                }
            }
        }

        function renderRiwayat(logs, container) {
            let html = '';
            let tanggalSebelumnya = '';

            logs.forEach((log) => {
                let icon = 'fa-pen'; let colorClass = 'bg-blue-100 text-blue-600';
                const actionUpper = (log.action || "").toUpperCase();
                
                if (actionUpper === 'CREATE') { icon = 'fa-plus'; colorClass = 'bg-emerald-100 text-emerald-600'; }
                else if (actionUpper === 'DELETE') { icon = 'fa-trash-can'; colorClass = 'bg-rose-100 text-rose-600'; }
                else if (actionUpper === 'DOWNLOAD') { icon = 'fa-download'; colorClass = 'bg-purple-100 text-purple-600'; }
                else if (actionUpper === 'UPLOAD') { icon = 'fa-upload'; colorClass = 'bg-orange-100 text-orange-600'; }

                let waktuLog = log.time || log.timestamp || null;
                let wkt = new Date();
                
                if (waktuLog) {
                    wkt = new Date(waktuLog);
                } else if (log.id && String(log.id).length >= 13) {
                    wkt = new Date(Number(log.id));
                }

                if (isNaN(wkt.getTime())) wkt = new Date(); 

                const jamText = wkt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const tanggalLengkap = wkt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                if (tanggalLengkap !== tanggalSebelumnya) {
                    html += `
                        <div class="pt-6 pb-2">
                            <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 bg-slate-200/50 px-3 py-1 rounded-md border border-slate-200">${tanggalLengkap}</span>
                        </div>
                    `;
                    tanggalSebelumnya = tanggalLengkap;
                }

                const deviceName = log.device || "SISTEM";
                const detailText = log.detail || log.message || "";

                html += `
                    <div class="log-item relative">
                        <div class="timeline-line"></div>
                        <div class="log-card p-4 flex gap-4 relative z-10 hover:border-blue-200 transition-colors">
                            <div class="w-12 h-12 rounded-full ${colorClass} flex items-center justify-center shrink-0">
                                <i class="fa-solid ${icon} text-lg"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-1">
                                    <h4 class="font-bold text-slate-800 text-sm tracking-tight break-words pr-2">
                                        ${log.module || "SISTEM"}
                                        <span class="text-[9px] font-bold ml-1.5 px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded border border-slate-200 uppercase">${deviceName}</span>
                                    </h4>
                                    <span class="text-[10px] font-bold text-slate-400 shrink-0 bg-slate-50 px-2 py-0.5 rounded-md border border-slate-100">${jamText}</span>
                                </div>
                                <p class="text-xs font-medium text-slate-500 leading-relaxed break-words pr-2">${detailText}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
