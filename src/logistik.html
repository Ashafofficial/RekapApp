<body class="text-slate-800 overflow-x-hidden">

    <!-- HEADER GAYA SAMSUNG ONE UI (Compact / Hemat Ruang) -->
    <header class="sticky top-0 z-40 bg-white px-3 py-3 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.1)] rounded-b-[1.2rem] border-b border-slate-200">
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-2.5">

                    <h1 class="text-lg font-black text-slate-900 tracking-tight flex items-center gap-1.5">
                        <div class="w-7 h-7 bg-indigo-600 text-white rounded-full flex items-center justify-center text-xs shadow-md"><i class="fa-solid fa-box-open"></i></div>
                        Tim Logistik
                    </h1>
                </div>
                <div class="flex gap-2">
                    <a href="index.html" class="bg-slate-100 text-slate-600 w-8 h-8 flex items-center justify-center rounded-full shadow-sm cursor-pointer hover:bg-slate-200 transition-colors border border-slate-200 active:scale-95" title="Kembali ke Dashboard">

                    <div class="bg-indigo-100 text-indigo-700 w-8 h-8 flex items-center justify-center rounded-full shadow-sm cursor-pointer hover:bg-indigo-200 transition-colors border border-indigo-200 active:scale-95" onclick="ambilDataSupabase()" title="Refresh Data">
                        <i class="fa-solid fa-rotate-right text-[11px]"></i>
                    </div>
                </div>
            </div>

            <!-- BARIS FILTER DISATUKAN (Sejajar Kiri-Kanan) -->
            <div class="flex gap-1.5">
                <!-- Kotak Pencarian -->
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-slate-400 text-[11px]"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Cari Resi / Nama..." 
                        class="w-full pl-8 pr-3 h-10 bg-slate-50 border border-slate-200 rounded-full text-[11px] font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all shadow-inner">
                </div>
                <!-- Kotak Dropdown Sarimbit -->
                <div class="relative w-[130px] shrink-0">
                    <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-filter text-slate-400 text-[10px]"></i>
                    </div>
                    <select id="filterSarimbit" class="w-full pl-7 pr-6 h-10 bg-slate-50 border border-slate-200 rounded-full text-[10px] appearance-none focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all font-bold text-slate-700 shadow-inner cursor-pointer">
                        <option value="">Semua Sarimbit</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">

                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">
        <div id="cardsContainer" class="flex flex-col gap-5">
            <div class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-indigo-500"></i>
                <p class="text-sm font-bold text-slate-500">Menarik data terbaru dari server...</p>
            </div>
        </div>
    </main>

    <!-- TOMBOL BATCH RESI (MELAYANG) -->
    <div onclick="bukaPanelBatch()" title="Keranjang Resi Shopee/TikTok" class="fixed bottom-6 right-6 z-40 w-16 h-16 bg-gradient-to-br from-indigo-600 to-blue-600 text-white rounded-full shadow-[0_8px_25px_rgba(79,70,229,0.5)] hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center justify-center border-4 border-white">
        <i class="fa-solid fa-layer-group text-2xl drop-shadow-md"></i>
        <div id="badgeBatch" class="absolute -top-1 -left-1 bg-rose-500 text-white text-[11px] font-black w-7 h-7 flex items-center justify-center rounded-full border-2 border-white hidden shadow-md">0</div>
    </div>

    <!-- MODAL KERANJANG BATCH -->
    <div id="modalBatch" class="fixed inset-0 bg-slate-900/60 z-[60] hidden flex-col justify-end transition-opacity opacity-0 pointer-events-none backdrop-blur-sm" style="transition: all 0.3s ease;">
        <div class="bg-white w-full max-w-md mx-auto h-[85vh] rounded-t-[2rem] flex flex-col shadow-2xl transform translate-y-full transition-transform duration-300 border-t border-white" id="modalBatchContent">
            
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-white rounded-t-[2rem]">
                <h3 class="font-black text-slate-900 text-base flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-layer-group"></i></div>
                    Keranjang Resi (Otomatis)
                </h3>
                <button onclick="tutupPanelBatch()" class="w-8 h-8 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-200 active:scale-95 transition-colors border border-slate-200"><i class="fa-solid fa-times font-bold"></i></button>
            </div>
            
            <div id="listBatchResi" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 custom-scrollbar">
                <!-- List Resi Masuk Sini -->
            </div>
            
            <div class="p-5 border-t border-slate-200 bg-white space-y-3 rounded-t-2xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] relative z-10">
                <label class="w-full py-3.5 bg-slate-100 text-slate-700 font-black rounded-xl flex items-center justify-center gap-2 border border-slate-300 active:scale-95 transition-all cursor-pointer text-sm hover:bg-slate-200">
                    <i class="fa-solid fa-camera text-indigo-500"></i> Scan / Tambah Foto Resi Baru
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="prosesTambahResiBatch(this)">
                </label>
                <button id="btnKirimBatch" onclick="kirimSemuaResiBatch()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all shadow-[0_8px_20px_rgba(79,70,229,0.3)] text-base hover:bg-indigo-700">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Semua (<span id="countBatchBtn">0</span>)
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[70] flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>

    <script>
        let orderData = []; 
        let groupedOrders = []; 
        let searchQuery = "";
        let filterValue = "";
        
        // STATE UNTUK KERANJANG RESI
        let batchResiList = [];

        // =======================================================
        // MESIN KOMPRESOR FOTO (SUPER CEPAT)
        // =======================================================
        async function kompresFotoKilat(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; 
                        const MAX_HEIGHT = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        } else if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
                    };
                };
            });
        }

        // =======================================================
        // PENARIK DATA LANGSUNG KE SUPABASE
        // =======================================================
        function ambilDataSupabase() {
            showToast("⏳ Mensinkronkan pesanan terbaru...", "loading");
            
            // JIKA MENGGUNAKAN SUPABASE VIA database.js (Paling Akurat)
            if (typeof window.DatabaseAPI !== 'undefined') {
                window.DatabaseAPI.getAllData(
                    async (res) => {
                        try {
                            const masterData = res.master || [];
                            let dataMentah = res.orders || [];

                            // Amankan arsip agar tidak nyampur
                            let sarimbitDiarsip = [];
                            try {
                                const localBuku = await dbLokal.pembukuan.toArray();
                                sarimbitDiarsip = localBuku.filter(b => b.isarchived === true || b.isArchived === true).map(b => b.sarimbit);
                            } catch(e) {}

                            // Mencocokkan Gramasi dengan Akurat (Menghindari bug huruf besar/kecil)
                            if (dataMentah.length > 0 && masterData.length > 0) {
                                const bersihkanStr = (val) => String(val || "").trim().toLowerCase();
                                const mapBerat = new Map();
                                masterData.forEach(m => {
                                    mapBerat.set(`${bersihkanStr(m.sarimbit)}|${bersihkanStr(m.barang)}|${bersihkanStr(m.varian)}|${bersihkanStr(m.size)}`, Number(m.berat || 0));
                                    // Cadangan Kasar
                                    if (!mapBerat.has(`${bersihkanStr(m.sarimbit)}|${bersihkanStr(m.barang)}`)) {
                                        mapBerat.set(`${bersihkanStr(m.sarimbit)}|${bersihkanStr(m.barang)}`, Number(m.berat || 0));
                                    }
                                });

                                dataMentah.forEach(order => {
                                    const kunciAkurat = `${bersihkanStr(order.sarimbit)}|${bersihkanStr(order.barang)}|${bersihkanStr(order.varian)}|${bersihkanStr(order.size)}`;
                                    const kunciKasar = `${bersihkanStr(order.sarimbit)}|${bersihkanStr(order.barang)}`;
                                    
                                    let beratKetemu = mapBerat.get(kunciAkurat);
                                    if (beratKetemu === undefined) beratKetemu = mapBerat.get(kunciKasar);
                                    
                                    order.berat = beratKetemu !== undefined ? beratKetemu : (Number(order.berat) || 0);
                                });
                            }

                            // Saring Data! Buang yang diarsip
                            orderData = dataMentah.filter(o => {
                                const statusBawaanArsip = o.isarchived === true || o.isArchived === true;
                                const statusTerarsipDiBuku = sarimbitDiarsip.includes(o.sarimbit);
                                return !statusBawaanArsip && !statusTerarsipDiBuku;
                            });
                            
                            prosesDataAwal();
                            populateFilterDropdown();
                            
                            // Kembalikan ingatan pencarian lama
                            const savedSearch = sessionStorage.getItem('logistikSearch');
                            if (savedSearch) {
                                searchQuery = savedSearch.toLowerCase();
                                document.getElementById('searchInput').value = savedSearch;
                            }
                            
                            const savedFilter = sessionStorage.getItem('logistikFilter');
                            if (savedFilter) {
                                filterValue = savedFilter;
                                document.getElementById('filterSarimbit').value = filterValue;
                            }

                            renderCards();
                            showToast(`✅ Data Terupdate! Ditemukan ${groupedOrders.length} antrean paket.`, "success");

                        } catch (err) {
                            console.error(err);
                            showToast("❌ Kesalahan saat memproses data!", "error");
                        }
                    },
                    (err) => {
                        showToast("❌ Gagal terhubung ke Database!", "error");
                    }
                );
            } else {
                document.getElementById('cardsContainer').innerHTML = `<div class="text-center py-10 text-rose-500 bg-white rounded-[1.5rem] border border-rose-200 shadow-sm"><i class="fa-solid fa-triangle-exclamation text-5xl mb-3"></i><p class="text-sm font-bold">Sistem Database Tidak Terdeteksi.</p></div>`;
                showToast("❌ File database.js tidak terbaca!", "error");
            }
        }

        function prosesDataAwal() {
            const groups = {};
            orderData.forEach(o => {
                const idUnik = o.idcustomer || o.idCustomer || o.id;
                if(!groups[idUnik]) {
                    groups[idUnik] = {
                        idCustomer: idUnik,
                        customer: o.customer || "Tanpa Nama",
                        telepon: o.telepon || o.telp || "-",
                        alamat: o.alamat || "-",
                        toko: o.toko || "Habibacollections",
                        ekspedisi: o.ekspedisi || o.kurir || o.shipping || "Belum Dipilih",
                        items: [],
                        teksPencarian: `${(o.customer || "").toLowerCase()} ${(o.sarimbit || "").toLowerCase()}`,
                        tanggalTerbaru: new Date(o.tanggal || o.created_at || o.updated_at || 0).getTime()
                    };
                }
                groups[idUnik].items.push(o);
                
                // Pastikan yang teratas adalah yang waktu update/belinya paling akhir
                const tglItem = new Date(o.tanggal || o.created_at || o.updated_at || 0).getTime();
                if (tglItem > groups[idUnik].tanggalTerbaru) {
                    groups[idUnik].tanggalTerbaru = tglItem;
                }
            });

            groupedOrders = Object.values(groups);
            groupedOrders.sort((a, b) => b.tanggalTerbaru - a.tanggalTerbaru); // Sortir: Terbaru di atas
        }

        function populateFilterDropdown() {
            const select = document.getElementById('filterSarimbit');
            select.innerHTML = '<option value="">Semua Sarimbit</option>';
            let uniqueSarimbits = new Set();
            orderData.forEach(o => { const namaStr = o.sarimbit || o.nama_sarimbit || o.nama; if(namaStr && namaStr.trim() !== "") uniqueSarimbits.add(namaStr.trim()); });
            [...uniqueSarimbits].sort().forEach(s => { const option = document.createElement('option'); option.value = s; option.textContent = s; select.appendChild(option); });
        }

      // =======================================================
        // RENDER KARTU GAYA SAMSUNG ONE UI (COMPACT & SOLID)
        // =======================================================
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; 

            const search = searchQuery;
            const filter = filterValue;

            let hasilFilter = groupedOrders;
            if (search !== "" || filter !== "") {
                hasilFilter = groupedOrders.filter(group => {
                    const cocokNama = search === "" || group.teksPencarian.includes(search);
                    const cocokFilter = filter === "" || group.items.some(i => i.sarimbit === filter);
                    return cocokNama && cocokFilter;
                });
            }

            if (hasilFilter.length === 0) {
                container.innerHTML = `<div class="text-center py-16 bg-white rounded-[2rem] border border-slate-200 shadow-sm"><i class="fa-solid fa-box-open text-5xl mb-4 text-slate-300"></i><p class="text-sm font-bold text-slate-500">Pesanan tidak ditemukan.</p></div>`;
                return;
            }

            const MAX_TAMPIL = 30;
            const totalData = hasilFilter.length;
            const dataDitampilkan = hasilFilter.slice(0, MAX_TAMPIL);

            const fragment = document.createDocumentFragment();

            dataDitampilkan.forEach(group => {
                const namaCustomer = group.customer.toUpperCase();
                const telepon = group.telepon;
                const alamat = group.alamat;
                const ekspedisi = group.ekspedisi.toUpperCase();
                const id = group.idCustomer;
                
                let pengirimNama = group.toko.toUpperCase();
                let pengirimTelp = pengirimNama === "MASARA.HIJAB" ? "082123846261" : "082320419977";

                let totalBeratGram = 0; 
                let itemHtml = '';
                
                group.items.forEach(item => {
                    const qty = item.jumlah || item.qty || item.quantity || 1;
                    const beratAsli = Number(item.berat || item.berat_gram || 0);
                    // KUNCI PERBAIKAN: Hapus penambahan +300g per item, gunakan berat murni!
                    totalBeratGram += (beratAsli * qty); 
                    
                    const namaBarang = item.sarimbit + " - " + item.barang;
                    const varian = item.varian || item.warna || "-";
                    const ukuran = item.size || item.ukuran || "-";

                    // BAGIAN 1: RINCIAN PESANAN (DIPERKECIL)
                    itemHtml += `
                        <div class="flex justify-between items-center py-1.5 border-b border-slate-200/60 border-dashed last:border-0">
                            <div class="flex-1 pr-2 leading-tight">
                                <span class="font-black text-indigo-600 text-[10px] mr-1 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded leading-none">${qty}x</span> 
                                <span class="text-slate-900 font-bold text-[11px] leading-tight">${namaBarang}</span>
                                <div class="text-[9px] font-bold text-slate-500 mt-1 flex items-center gap-1">
                                    <span class="bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded text-slate-700 leading-none">${varian}</span> 
                                    <span class="bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded text-slate-700 leading-none">SZ: ${ukuran}</span>
                                </div>
                            </div>
                            <div class="text-[9px] font-black text-slate-500 whitespace-nowrap bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded-md">${beratAsli * qty}g</div>
                        </div>`;
                });

                const totalBeratKg = (totalBeratGram / 1000).toFixed(2);
                let warnaEks = "bg-indigo-600";
                if(ekspedisi === "BELUM DIPILIH" || ekspedisi === "-") warnaEks = "bg-rose-500";
                else if(ekspedisi.includes("JNT") || ekspedisi.includes("J&T")) warnaEks = "bg-rose-500";
                else if(ekspedisi.includes("JNE")) warnaEks = "bg-blue-600";
                else if(ekspedisi.includes("POS")) warnaEks = "bg-orange-500";

                const card = document.createElement('div');
                card.className = "bg-white p-4 relative overflow-hidden mb-2 shadow-sm border border-slate-200 rounded-[1.5rem]"; 
                card.innerHTML = `
                    <!-- Badge Ekspedisi -->
                    <div class="absolute top-0 right-0 ${warnaEks} text-white text-[9px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-widest shadow-sm">${ekspedisi}</div>
                    
                    <!-- Info Customer -->
                    <div class="mb-3 pr-14 mt-0.5">
                        <h2 class="text-sm font-black text-slate-900 leading-tight mb-1.5"><i class="fa-solid fa-circle-user text-indigo-500 mr-1.5"></i>${namaCustomer}</h2>
                        <div class="text-[9px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full inline-flex items-center mb-1.5 shadow-sm">
                            <i class="fa-brands fa-whatsapp mr-1 text-[10px]"></i> ${telepon}
                        </div>
                        <p class="text-[10px] font-semibold text-slate-600 leading-snug"><i class="fa-solid fa-location-dot text-rose-500 mr-1.5"></i>${alamat}</p>
                    </div>

                    <!-- BAGIAN 2: KARTU PENGIRIM (DIPERKECIL) -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-2 mb-3 flex justify-between items-center shadow-sm">
                        <div>
                            <p class="text-slate-400 text-[8px] font-black uppercase tracking-widest mb-0.5">Pengirim</p>
                            <p class="font-black text-slate-800 text-[11px] leading-none">${pengirimNama}</p>
                            <p class="text-slate-500 text-[9px] font-semibold mt-0.5">${pengirimTelp}</p>
                        </div>
                        <div class="text-right border-l border-slate-200 pl-3">
                            <p class="text-slate-400 text-[8px] font-black uppercase tracking-widest mb-0.5">Estimasi Sistem</p>
                            <p class="font-black text-indigo-600 text-sm leading-none">${totalBeratKg} Kg</p>
                        </div>
                    </div>

                    <!-- Wrapper Rincian Barang -->
                    <div class="mb-4">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-box-open text-blue-500"></i> Rincian Baju <span class="text-[7px] bg-emerald-50 text-emerald-600 px-1 py-0.5 rounded ml-1 border border-emerald-200 leading-none">Murni</span></p>
                        <div class="bg-white rounded-lg p-2 border border-slate-200 shadow-sm">${itemHtml}</div>
                    </div>

                    <!-- AREA AKSI & TOMBOL -->
                    <div class="bg-indigo-50/40 -mx-4 -mb-4 p-4 border-t border-indigo-100/60 rounded-b-[1.5rem]">
                        
                        <!-- BAGIAN 3: KARTU BERAT TIMBANGAN (DIPERKECIL) -->
                        <div class="bg-white border border-orange-200 rounded-xl p-2.5 flex justify-between items-center mb-3 shadow-sm">
                            <div>
                                <p class="text-[10px] font-black text-orange-600 uppercase tracking-widest leading-none">Berat Timbangan</p>
                                <p class="text-[8px] text-orange-500 font-bold mt-1">Ubah jika meleset</p>
                            </div>
                            <div class="flex items-center bg-orange-50 border border-orange-200 rounded-lg px-2 py-1 focus-within:border-orange-500 focus-within:ring-4 focus-within:ring-orange-500/20 transition-all shadow-inner">
                                <input type="number" id="berat-aktual-${id}" value="${totalBeratKg}" step="0.01" class="w-12 text-center text-sm font-black text-orange-700 bg-transparent focus:outline-none appearance-none p-0 m-0">
                                <span class="ml-1 text-[10px] font-black text-orange-600">Kg</span>
                            </div>
                        </div>

                        <!-- Tombol SOP 1, 2, 3 (DIPERKECIL) -->
                        <div class="space-y-2.5">
                            <!-- SOP 1 -->
                            <div class="bg-white p-2.5 rounded-xl border border-blue-200 shadow-sm flex flex-col gap-2">

        async function prosesKirimTelegram(inputElement, idCustomer, tipeKirim, ekspedisi) {
            const fileFoto = inputElement.files[0];
            if (!fileFoto) return;
            inputElement.value = ""; 

            const items = orderData.filter(o => (o.idCustomer || o.idcustomer || o.id) == idCustomer);
            if (items.length === 0) return;

            const dataHead = items[0];
            const namaCustomer = dataHead.customer || "Tanpa Nama";
            // Data alamat sengaja dihilangkan dari pengiriman Telegram sesuai permintaan

            const elemenInputBerat = document.getElementById(`berat-aktual-${idCustomer}`);
            const beratAktualUntukTelegram = elemenInputBerat ? elemenInputBerat.value : "0";

            const TELEGRAM_BOT_TOKEN = "8997671589:AAFYx7JwYpOW2T5xRfg7RoTAyHR5Q5FJXfE"; 
            let captionTelegram = "";
            let targetChatIds = []; 

            if (tipeKirim === 'CEK_PAKET') {
                targetChatIds.push("-1004344989581");
                captionTelegram = `📦 *BUKTI CEK PAKET (BELUM PACKING)*\n\n👤 *Tujuan:* ${namaCustomer.toUpperCase()}\n\n🚚 *Ekspedisi:* ${ekspedisi}\n⚖ *Berat Timbangan:* ${beratAktualUntukTelegram} Kg`;
            } else if (tipeKirim === 'PACKING') {
                const kurirPilihan = (ekspedisi || "").toUpperCase().replace(/\s+/g, '');
                targetChatIds.push("-1004332448220"); 
                
                if (kurirPilihan.includes('JNE')) targetChatIds.push("@jnePacking"); 
                else if (kurirPilihan.includes('JNT') || kurirPilihan.includes('J&T')) targetChatIds.push("@PackingJNT"); 
                else if (kurirPilihan.includes('POS')) targetChatIds.push("@PackingPOS"); 
                else if (kurirPilihan.includes('LION')) targetChatIds.push("@PackingLION"); 

                captionTelegram = `📦 *BUKTI PACKING PAKET*\n\n👤 *Tujuan:* ${namaCustomer.toUpperCase()}\n\n🚚 *Ekspedisi:* ${ekspedisi}\n⚖ *Berat Timbangan:* ${beratAktualUntukTelegram} Kg`;
            } else {
                targetChatIds.push("-1004396862297"); 
                captionTelegram = `📸 *BUKTI RESI PENGIRIMAN*\n\n👤 *Tujuan:* ${namaCustomer.toUpperCase()}\n\n🚚 *Ekspedisi:* ${ekspedisi}\n⚖ *Berat Timbangan:* ${beratAktualUntukTelegram} Kg`;
            }

            let namaToast = tipeKirim === 'PACKING' ? "Packing" : (tipeKirim === 'CEK_PAKET' ? "Cek Paket" : "Resi");
            showToast(`⏳ Mengompres foto & mengirim ${namaToast}...`, "loading");

            const fotoDikompres = await kompresFotoKilat(fileFoto);
            let grupSukses = [], grupGagal = [];

            for (const chatId of targetChatIds) {
                const paketKirim = new FormData();
                paketKirim.append("chat_id", chatId); 
                paketKirim.append("photo", fotoDikompres, "foto_logistik.jpg"); 
                paketKirim.append("caption", captionTelegram);
                paketKirim.append("parse_mode", "Markdown");

                try {
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: "POST", body: paketKirim });
                    const balasan = await response.json();
                    if (balasan.ok) grupSukses.push(chatId);
                    else grupGagal.push(chatId);
                } catch (error) {
                    grupGagal.push(chatId);
                }
            }

            if (grupSukses.length > 0 && grupGagal.length === 0) showToast(`✅ GERCEP! Foto mendarat di Grup.`, "success");
            else if (grupSukses.length > 0 && grupGagal.length > 0) showToast(`⚠️ Sebagian berhasil, ada yang gagal terkirim.`, "error");
            else showToast(`❌ Gagal mengirim ke grup. Cek koneksi!`, "error");
        }

        // ===================================================================
        // 🚀 SCANNER TINGKAT LANJUT (KUSUS UNTUK RESI THERMAL & BLUR)
        // ===================================================================
        async function advancedScanKuat(file) {
            const imgObj = await new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
            });
            if(!imgObj) return "";

            let text = "";

            try {
                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'qr_code', 'itf'] });
                    const barcodes = await detector.detect(imgObj);
                    if (barcodes.length > 0) text = barcodes[0].rawValue;
                }
            } catch (e) {}

            if (!text) {
                try {
                    if (typeof ZXing !== 'undefined') {
                        const reader = new ZXing.BrowserMultiFormatReader();
                        const result = await reader.decodeFromImageElement(imgObj);
                        if (result && result.text) text = result.text;
                    }
                } catch (e) {}
            }

            if (text) {
                URL.revokeObjectURL(imgObj.src);
                return text;
            }

            async function doScan(canvas) {
                try {
                    if ('BarcodeDetector' in window) {
                        const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'qr_code'] });
                        const bmp = await createImageBitmap(canvas);
                        const barcodes = await detector.detect(bmp);
                        if (barcodes.length > 0) return barcodes[0].rawValue;
                    }
                } catch (e) {}
                try {
                    if (typeof ZXing !== 'undefined') {
                        const reader = new ZXing.BrowserMultiFormatReader();
                        const result = await reader.decodeFromCanvas(canvas);
                        if (result && result.text) return result.text;
                    }
                } catch (e) {}
                return "";
            }

            const c1 = document.createElement('canvas');
            const ctx1 = c1.getContext('2d', { willReadFrequently: true });
            
            let w = imgObj.width; let h = imgObj.height;
            const MAX = 2000; 
            if(w>h && w>MAX){ h*=MAX/w; w=MAX; } else if(h>w && h>MAX){ w*=MAX/h; h=MAX; }
            
            c1.width = w; c1.height = h;
            ctx1.filter = 'contrast(1.5) grayscale(100%) brightness(1.2)';
            ctx1.drawImage(imgObj, 0, 0, w, h);
            ctx1.filter = 'none';

            text = await doScan(c1);
            if (text) { URL.revokeObjectURL(imgObj.src); return text; }

            const c2 = document.createElement('canvas');
            const ctx2 = c2.getContext('2d', { willReadFrequently: true });
            c2.width = h; c2.height = w;
            ctx2.translate(h/2, w/2);
            ctx2.rotate(90 * Math.PI / 180);
            ctx2.filter = 'contrast(1.5) grayscale(100%) brightness(1.2)';
            ctx2.drawImage(imgObj, -w/2, -h/2, w, h);
            ctx2.filter = 'none';

            text = await doScan(c2);
            URL.revokeObjectURL(imgObj.src);
            return text;
        }

        async function prosesTambahResiBatch(inputEl) {
            const file = inputEl.files[0];

            let hasilScan = await advancedScanKuat(file);

            let promptMsg = hasilScan ? `✅ Terbaca: ${hasilScan}\n\nKetik/Edit Nama Customer (Opsional):` : `⚠️ Barcode gagal dibaca otomatis.\n\nSilakan ketik NOMOR RESI manual:`;
            let userInput = prompt(promptMsg, hasilScan);

            if(userInput === null) return; 

            batchResiList.push({
                id: Date.now(),
                file: file,
                teks: userInput,
                previewUrl: URL.createObjectURL(file)
            });

            showToast("✅ Berhasil masuk keranjang!", "success");
            renderBatchList();
        }

        function showToast(message, type = "success") {
            const container = document.getElementById('toastContainer');
            let bgClass = "bg-slate-800 text-white"; 
            if(type === "success") bgClass = "bg-emerald-600 text-white";
            if(type === "error") bgClass = "bg-rose-500 text-white";
            if(type === "loading") bgClass = "bg-indigo-600 text-white";

            const toast = document.createElement('div');
            toast.className = `${bgClass} px-4 py-3.5 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.2)] text-xs font-bold tracking-wide transition-all duration-300 transform translate-y-10 opacity-0 flex items-center w-full border border-white/20 z-50 text-center justify-center`;
            toast.innerHTML = `<span>${message}</span>`;
            if(type !== "loading") container.innerHTML = "";
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, type === "loading" ? 10000 : 4000);
        }
