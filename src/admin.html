<!DOCTYPE html>
<html lang="id">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Rincian & Nota Mobile</title>
        
       <!-- PENGATURAN LOGO APLIKASI (PWA & HOME SCREEN) -->
    <link rel="icon" type="image/png" href="logo-toko.png">
    <link rel="apple-touch-icon" href="logo-toko.png">
    <link rel="manifest" href="manifest.json">
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(() => console.log("Mode Offline Nota Aktif!"));
            }
        </script>
        
        <!-- PONDASI DESAIN & FONT -->
        <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- MESIN CETAK PDF & WORD -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <!-- PONDASI DATABASE LOKAL & AWAN (Pastikan file ini ada di folder yang sama) -->
    <script src="dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="database.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-800 relative">

    <!-- HEADER & PENCARIAN (MENEMPEL DI ATAS) -->
    <header class="bg-white/90 backdrop-blur-xl border-b border-slate-200/80 sticky top-0 z-40 shadow-sm shrink-0">
        <div class="px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="window.history.back()" class="w-9 h-9 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 active:scale-95 transition-all shadow-sm border border-slate-200/60">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div>
                    <h1 class="text-lg font-black text-slate-800 tracking-tight leading-none">Pusat Cetak Nota</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Versi Mobile Ringkas</p>
                </div>
            </div>
            <button onclick="loadDataServer()" class="w-9 h-9 flex items-center justify-center bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 active:scale-95 transition-all shadow-sm border border-blue-100">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <!-- KOLOM PENCARIAN MANUAL & FILTER (GAYA KAPSUL SAMSUNG) -->
        <div class="px-5 pb-4 flex items-center gap-2">
            <!-- Pencarian (Kapsul) -->
            <div class="relative flex-1 flex items-center bg-white border border-slate-200 hover:border-slate-300 focus-within:border-blue-400 focus-within:ring-4 focus-within:ring-blue-100 rounded-full transition-all shadow-sm h-11 px-1.5">
                <i class="fa-solid fa-search text-slate-400 ml-3 text-xs"></i>
                <input type="text" id="search-mobile" onkeyup="renderMobileList()" placeholder="Cari nama / WA..." class="w-full py-2 pl-3 pr-2 bg-transparent text-[11.5px] font-bold text-slate-700 outline-none placeholder:text-slate-400 placeholder:font-medium">
            </div>
            
            <!-- Filter Sarimbit (Kapsul) -->
            <div class="relative shrink-0 w-[140px]">
                <select id="filter-sarimbit-mobile" onchange="renderMobileList()" class="w-full h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-full pl-4 pr-8 text-[11px] font-bold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 transition-all shadow-sm appearance-none cursor-pointer">
                    <option value="">Sarimbit</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none"></i>
            </div>
        </div>
    </header>

    <!-- WADAH DAFTAR KARTU PELANGGAN -->
    <main class="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-4" id="mobile-list-container">
        <!-- Kartu Pelanggan masuk di sini lewat JS -->
        <div class="py-20 text-center text-slate-400 font-bold animate-pulse">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 block text-blue-500"></i>Memuat Data Pelanggan...
        </div>
    </main>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[200] flex items-center gap-3 opacity-0 scale-90 -translate-y-32 transition-all duration-500 ease-out bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 pointer-events-none w-max max-w-[90vw]">
        <span id="toast-msg" class="text-xs font-bold tracking-wide"></span>
    </div>

    <!-- ========================================================= -->
    <!-- MODAL RINCIAN PESANAN & UNDUH NOTA (MUNCUL DARI BAWAH) -->
    <!-- ========================================================= -->
    <!-- REVISI 1: Latar belakang luar dibuat transparan murni tanpa efek gelap/blur -->
    <div id="modalDetailCustomerMobile" class="hidden fixed inset-0 z-[150] bg-transparent flex items-end justify-center transition-opacity duration-300 opacity-0 md:px-4 md:pb-4">
        
        <!-- REVISI 2: Modal diubah jadi sedikit blur (efek kaca) agar halaman utama di belakang membayang -->
        <div class="bg-white/60 backdrop-blur-md rounded-t-[2.5rem] md:rounded-[2rem] w-full max-w-md shadow-[0_20px_60px_rgba(0,0,0,0.15)] overflow-hidden border border-white/60 flex flex-col max-h-[85vh] transform translate-y-full transition-transform duration-300" id="modalDetailCustomerMobileContent">
            
            <!-- Header Pop-Up Transparan -->
            <div class="p-6 bg-transparent text-slate-800 flex justify-between items-center relative z-10 shrink-0 border-b border-white/50">
                <div class="flex-1 min-w-0 pr-4">
                    <h3 class="font-black text-lg flex items-center gap-2 tracking-wide"><i class="fa-solid fa-receipt text-blue-600 drop-shadow-sm"></i> Rincian Pesanan</h3>
                    <p id="mdc-nama" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 truncate">NAMA CUSTOMER</p>
                </div>
                <button onclick="tutupModalDetailCustomerMobile()" class="w-8 h-8 shrink-0 flex items-center justify-center bg-slate-100/50 text-slate-500 rounded-full hover:bg-slate-200/80 transition-colors active:scale-95 shadow-sm border border-slate-200/60 backdrop-blur-md">
                    <i class="fa-solid fa-xmark font-bold text-sm"></i>
                </button>
            </div>
            
          <!-- Isi Rincian (HANYA BARANG) -->
          <div class="p-6 overflow-y-auto custom-scrollbar flex-1 relative flex flex-col">
                
            <!-- Daftar Barang Dipesan (Menyatu dengan Kaca Luar) -->
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/40">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i class="fa-solid fa-box-open text-blue-500"></i> Item Dipesan</span>
                    <span id="mdc-totalpcs" class="text-[11px] font-black text-indigo-700 bg-white/50 px-2.5 py-1 rounded-md border border-white/60 shadow-sm">0 Pcs</span>
                </div>
                <div id="mdc-items" class="space-y-0 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                    <!-- Barang masuk di sini lewat JS -->
                </div>
            </div>
        </div>
            <!-- Footer Aksi Utama -->
            <div class="p-5 bg-transparent shrink-0 flex">
                <button type="button" onclick="mdcUnduhPdf()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-full font-black text-[12px] uppercase tracking-widest shadow-md hover:shadow-lg active:scale-95 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-file-pdf text-[14px]"></i> UNDUH NOTA PDF
                </button>
            </div>
        </div>
    </div>

<script>
    // ==========================================
    // DEKLARASI DATA & FUNGSI PENDUKUNG
    // ==========================================
    let masterData = [];
    let orderData = [];
    let appSettings = JSON.parse(localStorage.getItem('sarimbitSettings')) || { nama: "Toko Sarimbit", kontak: "081234567890", catatan: "Terima kasih telah berbelanja." };
    window.currentMdcIdCustomer = null;

    const formatRp = (n) => "Rp " + Number(n || 0).toLocaleString('id-ID');
    
    const showToast = (m) => {
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = m;
        t.classList.remove('-translate-y-32', 'opacity-0', 'scale-90');
        t.classList.add('translate-y-0', 'opacity-100', 'scale-100');
        setTimeout(() => {
            t.classList.remove('translate-y-0', 'opacity-100', 'scale-100');
            t.classList.add('-translate-y-32', 'opacity-0', 'scale-90');
        }, 3000);
    };

    // Helper Penarik Riwayat Aman
    window.dapatkanRiwayatAman = function(orderHead) {
        if (!orderHead) return [];
        let validRiwayat = [];
        let rawRiwayat = orderHead.riwayat_pembayaran;
        
        if (Array.isArray(rawRiwayat)) {
            validRiwayat = rawRiwayat.filter(b => Number(b.nominal) > 0);
        } else if (typeof rawRiwayat === 'string' && rawRiwayat.trim() !== "") {
            try {
                const parsed = JSON.parse(rawRiwayat);
                if (Array.isArray(parsed)) validRiwayat = parsed.filter(b => Number(b.nominal) > 0);
            } catch(e) {}
        }
        
        // Fallback jika kosong, tarik dari kolom C1, C2, C3 lama
        if (validRiwayat.length === 0) {
            const tglDef = (orderHead.tanggal || new Date().toISOString()).split('T')[0];
            const c1 = Number(orderHead.cicilan1) || 0;
            const c2 = Number(orderHead.cicilan2) || 0;
            const c3 = Number(orderHead.cicilan3) || 0;
            if (c1 > 0) validRiwayat.push({ nominal: c1, tgl: tglDef });
            if (c2 > 0) validRiwayat.push({ nominal: c2, tgl: tglDef });
            if (c3 > 0) validRiwayat.push({ nominal: c3, tgl: tglDef });
        }
        return validRiwayat;
    };

  // ==========================================
    // MEMUAT DATA DARI DATABASE LOKAL
    // ==========================================
    async function loadDataServer() {
        if (typeof window.DatabaseAPI !== 'undefined') {
            window.DatabaseAPI.getAllData(
                (res) => { 
                    masterData = res.master || [];
                    const semuaOrder = res.orders || [];
                    // Singkirkan data arsip
                    orderData = semuaOrder.filter(o => o.isarchived !== true && o.isArchived !== true);
                    populateSarimbitFilter(); // AKTIFKAN FILTER SARIMBIT
                    renderMobileList();
                    showToast("✅ Data berhasil diperbarui!");
                },
                (err) => { showToast("❌ Gagal memuat data dari server."); }
            );
        } else {
            // Fallback memuat dari memori lokal (Dexie)
            try {
                if(typeof dbLokal !== 'undefined') {
                    masterData = await dbLokal.master.toArray();
                    const sem = await dbLokal.orders.toArray();
                    orderData = sem.filter(o => o.isarchived !== true && o.isArchived !== true && o.syncstatus !== -1);
                    populateSarimbitFilter(); // AKTIFKAN FILTER SARIMBIT
                    renderMobileList();
                }
            } catch(e) {
                document.getElementById('mobile-list-container').innerHTML = `<div class="text-center text-rose-500 font-bold mt-10">Database belum siap.</div>`;
            }
        }
    }

    // MESIN PENGISI DROPDOWN FILTER SARIMBIT
    function populateSarimbitFilter() {
        const filterEl = document.getElementById('filter-sarimbit-mobile');
        if (!filterEl) return;
        const currentVal = filterEl.value;
        const daftarSarimbit = [...new Set(orderData.map(o => o.sarimbit).filter(Boolean))].sort();
        let html = `<option value="">Semua Koleksi</option>`;
        daftarSarimbit.forEach(s => {
            html += `<option value="${s}">${s}</option>`;
        });
        filterEl.innerHTML = html;
        if (daftarSarimbit.includes(currentVal)) filterEl.value = currentVal;
        else filterEl.value = "";
    }

    // ==========================================
    // RENDER DAFTAR KARTU PELANGGAN
    // ==========================================
    function renderMobileList() {
        const wadah = document.getElementById('mobile-list-container');
        const search = document.getElementById('search-mobile').value.toLowerCase().trim();
        const filterSarimbit = document.getElementById('filter-sarimbit-mobile').value; // MENARIK NILAI FILTER
        
        const groups = {};
        
        // Pengelompokan Data per Customer
        orderData.forEach(o => {
            const cocokNama = (o.customer || "").toLowerCase().includes(search);
            const cocokSarimbit = (o.sarimbit || "").toLowerCase().includes(search);
            const cocokTelp = (o.telepon || "").includes(search);
            
            // Logika Penyaringan
            if (search && !cocokNama && !cocokSarimbit && !cocokTelp) return;
            if (filterSarimbit && o.sarimbit !== filterSarimbit) return; // MENGAPLIKASIKAN FILTER
            
            const rawId = (o.idcustomer || o.idCustomer || "").toString().trim();
            const cleanName = (o.customer || "Tanpa Nama").toLowerCase().replace(/\s+/g, ' ').trim();
            const idUnik = rawId !== "" ? rawId : "ID_LAMA_" + cleanName;
            
            if (!groups[idUnik]) {
                groups[idUnik] = {
                    idCustomer: idUnik, nama: o.customer || "Tanpa Nama", telp: o.telepon || "-", alamat: o.alamat || "-", items: [],
                    tglTerbaru: o.tanggal ? new Date(o.tanggal).getTime() : 0
                };
            } else {
                const tglB = o.tanggal ? new Date(o.tanggal).getTime() : 0;
                if(tglB > groups[idUnik].tglTerbaru) groups[idUnik].tglTerbaru = tglB;
            }
            groups[idUnik].items.push(o);
        });

        const customerKeys = Object.keys(groups);
        
        // Urutkan dari yang paling baru
        customerKeys.sort((a, b) => groups[b].tglTerbaru - groups[a].tglTerbaru);

        if (customerKeys.length === 0) {
            wadah.innerHTML = `
                <div class="py-16 text-center text-slate-400">
                    <i class="fa-solid fa-folder-open text-5xl mb-4 block text-slate-300"></i>
                    <h3 class="font-bold text-sm">Tidak ada pelanggan ditemukan</h3>
                </div>`;
            return;
        }

        // Cetak Kartu Utama
        wadah.innerHTML = customerKeys.map(key => {
            const c = groups[key];
            const totalItem = c.items.reduce((sum, it) => sum + (Number(it.jumlah) || 0), 0);
            
            // TARIK NAMA TOKO SECARA CERDAS
            const namaToko = c.items[0]?.toko || "Toko Tidak Diketahui";
            
            // --- MESIN HITUNG KEUANGAN & LOGISTIK (UNTUK TAMPIL DI LUAR POP-UP) ---
            const totalBelanja = c.items.reduce((sum, it) => sum + ((Number(it.harga) || 0) * (Number(it.jumlah) || 0)), 0);
            const dTipe = c.items[0]?.diskonTipe || 'none';
            const dNilai = Number(c.items[0]?.diskonNilai) || 0;
            let totalDiskon = (dTipe === 'persen') ? (totalBelanja * dNilai) / 100 : (dTipe === 'angka' ? dNilai : 0);
            
            const riwayat = typeof window.dapatkanRiwayatAman === 'function' ? window.dapatkanRiwayatAman(c.items[0]) : [];
            let totalMasuk = 0;
            riwayat.forEach(b => totalMasuk += Number(b.nominal) || 0);
            
            const ongkir = Number(c.items[0]?.ongkir) || 0;
            const sisaTagihan = (totalBelanja - totalDiskon + ongkir) - totalMasuk;
            
            let statusText = "BELUM LUNAS";
            let statusClass = "text-rose-500";
            if (sisaTagihan <= 0) {
                statusText = "LUNAS 100%";
                statusClass = "text-emerald-600";
            }
            
            const ekspedisi = (c.items[0]?.ekspedisi || "-").toUpperCase();
            
            const totalBeratGram = c.items.reduce((sum, it) => {
                let gramItem = Number(it.berat || it.Berat || 0);
                if (gramItem === 0 && typeof dapatkanBeratLive === 'function') {
                    gramItem = dapatkanBeratLive(it.sarimbit, it.barang, it.varian, it.size);
                }
                return sum + (gramItem * (Number(it.jumlah) || 1));
            }, 0);
            const beratFormatted = totalBeratGram >= 1000 ? (totalBeratGram / 1000).toFixed(2) + " kg" : totalBeratGram + " gr";
            const formatRp = (n) => "Rp " + Number(n || 0).toLocaleString('id-ID');
            // ---------------------------------------------------------------------

            return `
            <div class="bg-white p-4 rounded-[1.2rem] border border-slate-200 shadow-sm flex flex-col gap-3 relative overflow-hidden group mt-1">
                <div class="flex justify-between items-start">
                    <div class="pr-2 flex flex-col gap-1.5">
                        <span class="w-fit bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md text-[8px] font-black uppercase tracking-widest border border-indigo-100 shadow-sm">${namaToko}</span>
                        <h3 class="font-black text-slate-800 text-[14px] leading-tight mb-0.5 truncate max-w-[200px]">${c.nama.toUpperCase()}</h3>
                        <span class="text-[10px] font-bold text-emerald-600 flex items-center gap-1.5"><i class="fa-brands fa-whatsapp text-xs"></i> ${c.telp}</span>
                    </div>
                    <span class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg text-[10px] font-black shrink-0 border border-blue-100 shadow-inner mt-1">${totalItem} Pcs</span>
                </div>
                
                <div class="text-[10.5px] text-slate-500 font-medium leading-snug line-clamp-2 bg-slate-50 p-2 rounded-lg border border-slate-100 mb-1">
                    ${c.alamat}
                </div>

                <!-- INFO KEUANGAN DAN LOGISTIK (TAMPIL DI KARTU LUAR) -->
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex flex-col justify-center">
                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Status Pembayaran</span>
                        <span class="text-[11px] font-black ${statusClass}">${statusText}</span>
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex flex-col justify-center text-right">
                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Sisa Tagihan</span>
                        <span class="text-[12px] font-black text-slate-800">${formatRp(sisaTagihan)}</span>
                    </div>
                </div>

                <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm mt-0.5">
                    <div class="flex justify-between items-center mb-2.5 pb-2.5 border-b border-slate-50">
                        <span class="text-[9px] font-black text-blue-600 uppercase tracking-widest flex items-center gap-1.5"><i class="fa-solid fa-truck-fast"></i> Ekspedisi & Ongkir</span>
                        <span class="text-[9px] font-black text-slate-700 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">${ekspedisi}</span>
                    </div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-[10px] font-bold text-slate-500">Biaya Ongkir:</span>
                        <span class="text-[11px] font-black text-orange-600">${formatRp(ongkir)}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-500">Total Berat:</span>
                        <span class="text-[11px] font-black text-slate-700">${beratFormatted}</span>
                    </div>
                </div>
                
                <!-- TOMBOL GAYA KAPSUL SEJAJAR (LIHAT RINCIAN & UNDUH PDF) -->
                <div class="flex gap-2.5 w-full mt-1">
                    <button type="button" onclick="bukaModalDetailCustomerMobile('${c.idCustomer}')" class="flex-1 h-11 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-[10.5px] font-black uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all shadow-sm border border-slate-200">
                        <i class="fa-solid fa-list-check text-[13px] text-slate-500"></i> Rincian
                    </button>
                    
                    <button type="button" onclick="window.currentMdcIdCustomer = '${c.idCustomer}'; mdcUnduhPdf();" class="flex-1 h-11 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-full text-[10.5px] font-black uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all shadow-[0_4px_12px_rgba(16,185,129,0.3)] hover:shadow-[0_6px_20px_rgba(16,185,129,0.4)] hover:from-emerald-600 hover:to-teal-600 border border-emerald-400">
                        <i class="fa-solid fa-file-pdf text-[13px]"></i> Unduh Nota
                    </button>
                </div>
            </div>
            `;
        }).join('');
    }

    window.bukaModalDetailCustomerMobile = function(idCustomer) {
        const items = orderData.filter(o => (o.idcustomer || o.idCustomer) === idCustomer);
        if(items.length === 0) return;
        
        window.currentMdcIdCustomer = idCustomer;
        const c = items[0];
        
        // Tulis Nama
        document.getElementById('mdc-nama').innerText = c.customer.toUpperCase();
        
        // Hanya menghitung total item Pcs
        const totalPcs = items.reduce((sum, it) => sum + (Number(it.jumlah) || 0), 0);
        document.getElementById('mdc-totalpcs').innerText = totalPcs + " Pcs";
        
        // Susun Daftar Barang
        const htmlItems = items.map(it => `
            <div class="py-3 border-b border-slate-200/50 last:border-0">
                <div class="text-[11.5px] font-bold text-slate-700 leading-tight mb-2"><span class="text-blue-600 font-black mr-1 text-[13px]">${it.jumlah}x</span> ${it.sarimbit} - ${it.barang}</div>
                <div class="flex gap-2">
                    <span class="text-[9px] font-bold text-slate-500 uppercase bg-slate-100/50 px-2.5 py-0.5 rounded-md border border-slate-200/60 tracking-wider">${it.varian}</span>
                    <span class="text-[9px] font-black text-indigo-600 bg-indigo-50/50 px-2.5 py-0.5 rounded-md border border-indigo-200/60 tracking-wider">SZ: ${it.size}</span>
                </div>
            </div>
        `).join('');
        
        document.getElementById('mdc-items').innerHTML = htmlItems;
        
        // Tampilkan Pop-Up
        const modal = document.getElementById('modalDetailCustomerMobile');
        const content = document.getElementById('modalDetailCustomerMobileContent');
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('translate-y-full');
        }, 10);
    };

    window.tutupModalDetailCustomerMobile = function() {
        const modal = document.getElementById('modalDetailCustomerMobile');
        const content = document.getElementById('modalDetailCustomerMobileContent');
        modal.classList.add('opacity-0');
        content.classList.add('translate-y-full');
        setTimeout(() => modal.classList.add('hidden'), 300);
    };

    // ==========================================
    // MESIN CETAK NOTA PDF LENGKAP (DENGAN LOGO)
    // ==========================================
    window.mdcUnduhPdf = async function() {
        if(!window.currentMdcIdCustomer) return;
        const items = orderData.filter(o => (o.idcustomer || o.idCustomer) === window.currentMdcIdCustomer);
        if(items.length === 0) return showToast("⚠️ Data tidak ditemukan!");
        
        showToast("⏳ Sedang memproses PDF Nota...");
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4'); 
        
        const head = items[0];
        
       // DETEKSI OTOMATIS KONTAK & LOGO BERDASARKAN TOKO PINTAR
       let namaToko = String(head.toko || appSettings.nama || "").toUpperCase();
        let kontakToko = appSettings.kontak; 
        let namaFileLogo = 'logo-toko.png'; 

        if (namaToko.includes("MASARA")) {
            kontakToko = "082123846261"; 
            namaFileLogo = 'logo-masara.png'; 
        } 
        else if (namaToko.includes("HABIBA")) {
            kontakToko = "08111341234";
            namaFileLogo = 'logo-habiba.png'; 
        }

        // FUNGSI MEMBACA GAMBAR LOGO
        const loadLogo = (url) => {
            return new Promise((resolve) => {
                let img = new Image();
                img.crossOrigin = "Anonymous"; 
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = () => resolve(null); 
                img.src = url;
            });
        };

        const logoDataUrl = await loadLogo(namaFileLogo);

        if (logoDataUrl) {
            doc.addImage(logoDataUrl, 'PNG', 14, 15, 22, 22);
        } else {
            doc.setFillColor(241, 245, 249); doc.setDrawColor(226, 232, 240); 
            doc.circle(25, 26, 11, 'FD'); 
            doc.setFontSize(8); doc.setTextColor(150); doc.text("LOGO", 21, 27);
        }

        doc.setFontSize(22); doc.setTextColor(30, 41, 59); doc.setFont(undefined, 'bold');
        doc.text(namaToko.toUpperCase(), 42, 22);
        doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text(`WA: ${kontakToko}`, 42, 32);

        doc.setFontSize(24); doc.setTextColor(226, 232, 240); doc.setFont(undefined, 'bold');
        doc.text("INVOICE", 195, 22, { align: "right" });
        doc.setFontSize(9); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'bold');
        
        doc.text("Nomor Nota:", 135, 28);
        doc.setTextColor(30, 41, 59);
        doc.text((window.currentMdcIdCustomer || "").substring(0, 20), 195, 28, { align: "right" }); 
        
        doc.setTextColor(148, 163, 184);
        doc.text("Tanggal Cetak:", 135, 33);
        doc.setTextColor(30, 41, 59);
        doc.text(new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}), 195, 33, { align: "right" });

        doc.setDrawColor(226, 232, 240);
        doc.line(14, 42, 196, 42);

        doc.setFillColor(248, 250, 252);
        doc.roundedRect(14, 46, 182, 35, 3, 3, 'FD');
        doc.setFontSize(8); doc.setTextColor(148, 163, 184); doc.setFont(undefined, 'bold');
        doc.text("TAGIHAN & PENGIRIMAN KEPADA:", 18, 53);
        doc.setFontSize(12); doc.setTextColor(30, 41, 59);
        doc.text((head.customer || "-").toUpperCase(), 18, 59);
        doc.setFontSize(9); doc.setTextColor(71, 85, 105); doc.setFont(undefined, 'normal');
        doc.text(`WA: ${head.telepon || "-"}`, 18, 65);
        
        const splitAlamat = doc.splitTextToSize(head.alamat || "-", 170);
        doc.text(splitAlamat, 18, 70);

        const tableBody = items.map((it, idx) => {
            return [
                idx + 1,
                `${it.sarimbit} - ${it.barang}\nVarian: ${it.varian} / Size: ${it.size}`,
                it.jumlah,
                formatRp(it.harga || 0),
                formatRp((it.harga || 0) * it.jumlah)
            ];
        });

        let finalY = 86;

        doc.autoTable({
            startY: 86,
            head: [['No', 'Nama Barang & Detail', 'Qty', 'Harga Satuan', 'Subtotal']],
            body: tableBody,
            theme: 'grid',
            headStyles: { fillColor: [30, 41, 59], textColor: 255, fontStyle: 'bold' },
            styles: { fontSize: 9, cellPadding: 4, valign: 'middle' },
            columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                2: { halign: 'center', fontStyle: 'bold', cellWidth: 15 },
                3: { halign: 'right', cellWidth: 35 },
                4: { halign: 'right', fontStyle: 'bold', textColor: [30, 41, 59], cellWidth: 35 }
            },
            didDrawPage: function (data) { finalY = data.cursor.y; }
        });

        const totalBelanja = items.reduce((sum, it) => sum + ((it.harga || 0) * it.jumlah), 0);
        const ongkir = Number(head.ongkir || 0);

        const tipeDiskon = head.diskonTipe || 'none';
        const nilaiDiskon = Number(head.diskonNilai) || 0;
        let totalDiskon = 0;
        if (tipeDiskon === 'persen') {
            totalDiskon = (totalBelanja * nilaiDiskon) / 100;
        } else if (tipeDiskon === 'angka') {
            totalDiskon = nilaiDiskon;
        }

        let grandTotal = totalBelanja - totalDiskon + ongkir;
        if (grandTotal < 0) grandTotal = 0;

        const riwayat = typeof window.dapatkanRiwayatAman === 'function' ? window.dapatkanRiwayatAman(head) : [];
        const cicilan1 = riwayat.length > 0 ? Number(riwayat[0].nominal) : 0;
        const cicilan2 = riwayat.length > 1 ? Number(riwayat[1].nominal) : 0;
        const cicilan3 = riwayat.length > 2 ? Number(riwayat[2].nominal) : 0;
        
        let totalMasuk = 0;
        riwayat.forEach(b => totalMasuk += Number(b.nominal) || 0);
        const sisaTagihan = grandTotal - totalMasuk;

        let yInfo = finalY + 10;
        doc.setDrawColor(226, 232, 240);
        doc.line(100, yInfo, 196, yInfo);
        
        yInfo += 6;
        doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text(`Total Belanja Barang (${items.reduce((s,i)=>s+Number(i.jumlah),0)} Pcs)`, 100, yInfo);
        doc.setTextColor(30, 41, 59); doc.setFont(undefined, 'bold');
        doc.text(formatRp(totalBelanja), 196, yInfo, { align: "right" });

        if (totalDiskon > 0) {
            yInfo += 6;
            doc.setTextColor(244, 63, 94); 
            doc.setFont(undefined, 'normal');
            let teksLabelDiskon = tipeDiskon === 'persen' ? `Diskon Order (${nilaiDiskon}%)` : `Diskon Order (Nominal)`;
            doc.text(teksLabelDiskon, 100, yInfo);
            doc.setFont(undefined, 'bold');
            doc.text(`- ${formatRp(totalDiskon)}`, 196, yInfo, { align: "right" });
        }

        yInfo += 6;
        doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text("Biaya Ongkos Kirim", 100, yInfo);
        doc.setTextColor(30, 41, 59); doc.setFont(undefined, 'bold');
        doc.text(formatRp(ongkir), 196, yInfo, { align: "right" });

        yInfo += 4;
        doc.setFillColor(241, 245, 249);
        doc.roundedRect(100, yInfo, 96, 10, 2, 2, 'FD');
        doc.setTextColor(30, 41, 59); doc.setFont(undefined, 'bold');
        doc.text("GRAND TOTAL", 104, yInfo + 6.5);
        doc.setTextColor(37, 99, 235); doc.setFontSize(11);
        doc.text(formatRp(grandTotal), 192, yInfo + 6.5, { align: "right" });

        yInfo += 16;
        doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text("Pembayaran Masuk (DP/Cicilan 1)", 104, yInfo);
        doc.setTextColor(5, 150, 105); doc.setFont(undefined, 'bold'); 
        doc.text(`- ${formatRp(cicilan1)}`, 192, yInfo, { align: "right" });

        yInfo += 6;
        doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text("Pembayaran Masuk (Cicilan 2)", 104, yInfo);
        doc.setTextColor(5, 150, 105); doc.setFont(undefined, 'bold');
        doc.text(`- ${formatRp(cicilan2)}`, 192, yInfo, { align: "right" });
        
        yInfo += 6;
        doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'normal');
        doc.text("Pembayaran Masuk (Pelunasan)", 104, yInfo);
        doc.setTextColor(5, 150, 105); doc.setFont(undefined, 'bold');
        doc.text(`- ${formatRp(cicilan3)}`, 192, yInfo, { align: "right" });

        yInfo += 6;
        doc.setFillColor(255, 241, 242);
        doc.setDrawColor(244, 63, 94);
        doc.setLineWidth(0.5);
        doc.roundedRect(100, yInfo, 96, 14, 2, 2, 'DF');
        doc.setTextColor(225, 29, 72); 
        doc.setFontSize(10); doc.setFont(undefined, 'bold');
        doc.text("SISA TAGIHAN", 104, yInfo + 9);
        doc.setFontSize(14);
        doc.text(formatRp(sisaTagihan), 192, yInfo + 9.5, { align: "right" });

        yInfo += 30;
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.2);
        doc.line(14, yInfo, 196, yInfo);
        
        yInfo += 6;
        doc.setFontSize(8); doc.setTextColor(30, 41, 59); doc.setFont(undefined, 'bold');
        doc.text("CATATAN PEMBELIAN", 105, yInfo, { align: "center" });
        
        yInfo += 4;
        doc.setFontSize(8); doc.setTextColor(100, 116, 139); doc.setFont(undefined, 'italic');
        const catatanSplit = doc.splitTextToSize(`"Barang PO (Pre-Order) akan dikirimkan sesuai estimasi jadwal ready. ${appSettings.catatan || 'Terima kasih telah berbelanja.'}"`, 160);
        doc.text(catatanSplit, 105, yInfo, { align: "center" });

        const cleanName = (head.customer || "Nota").replace(/[^a-zA-Z0-9]/g, '_');
        
        // Simpan Data
        if (typeof window.simpanKeTauriData === 'function') {
            const arrayBuffer = doc.output('arraybuffer');
            const uint8Array = new Uint8Array(arrayBuffer);
            window.simpanKeTauriData(new Blob([uint8Array]), `NOTA_${cleanName}.pdf`);
        } else {
            window.saveAs(doc.output('blob'), `NOTA_${cleanName}.pdf`);
            showToast("✅ PDF Nota Berhasil Diunduh!");
        }
    };

    // Jalankan muat data pertama kali
    window.onload = () => { loadDataServer(); };
</script>
</body>
</html>
