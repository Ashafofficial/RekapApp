name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Mengambil kode proyek
        uses: actions/checkout@v4

      - name: Menyiapkan mesin Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Menyiapkan mesin pembuat aplikasi (Rust)
        uses: dtolnay/rust-toolchain@stable

      - name: Menginstal komponen sarimbit
        run: npm install

      - name: Mencetak aplikasi Windows (.exe)
        run: npm run tauri build

      - name: Menyimpan hasil .exe agar bisa di-download
        uses: actions/upload-artifact@v4
        with:
          name: RekapApp-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
