name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Mesin Rust (Untuk Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Siapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Install Kebutuhan NPM
        run: npm install

      - name: Rakit Aplikasi Android (Mode Debug/Siap Instal)
        run: npm run tauri android build -- --debug

      - name: Simpan Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: SarimbitPro-Android-Siap-Instal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk